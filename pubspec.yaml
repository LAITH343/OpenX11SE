name: openx11se
description: "Open-source configuration app for the Attack Shark X11SE mouse."
publish_to: 'none'

version: 1.2.0+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  sqlite3: 3.5.2
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  ffi: ^2.2.0
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/tray.ico
    - assets/icons/tray_macos.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
    - family: Phosphor
      fonts:
        - asset: assets/icons/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/icons/Phosphor-Fill.ttf
