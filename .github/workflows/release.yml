name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match pubspec version $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - run: flutter pub get

      - run: flutter test

      - name: Build installer
        shell: pwsh
        run: ./tool/build_windows_installer.ps1 -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = git describe --tags --abbrev=0 --match 'v*.*.*' '${{ github.ref_name }}^' 2>$null
          $range = if ($LASTEXITCODE -eq 0 -and $previous) { "$previous..${{ github.ref_name }}" } else { '${{ github.ref_name }}' }
          $notes = git log $range --no-merges --pretty=format:'- %s'
          if (-not $notes) { $notes = '- Maintenance release' }
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          $installer = "build/installer/OpenX11SE-Setup-$env:VERSION.exe"
          gh release create '${{ github.ref_name }}' $installer "$installer.sha256" --title "OpenX11SE $env:VERSION" --notes-file release-notes.md

