name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match pubspec version $version"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - run: flutter pub get

      - run: flutter test

      - name: Build installer
        shell: pwsh
        run: ./tool/build_windows_installer.ps1 -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/installer/OpenX11SE-Setup-*.exe
            build/installer/OpenX11SE-Setup-*.exe.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' pubspec.yaml | head -n 1)
          if [ "v$version" != '${{ github.ref_name }}' ]; then
            echo "Tag ${{ github.ref_name }} does not match pubspec version $version" >&2
            exit 1
          fi

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

      - run: flutter pub get

      - run: flutter test

      - name: Build app archive
        run: ./tool/build_macos_release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/macos-release/OpenX11SE-macOS-*.dmg
            build/macos-release/OpenX11SE-macOS-*.dmg.sha256
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ github.ref_name }}'
          version="${version#v}"
          if previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' '${{ github.ref_name }}^' 2>/dev/null); then
            range="$previous..${{ github.ref_name }}"
          else
            range='${{ github.ref_name }}'
          fi
          git log "$range" --no-merges --pretty=format:'- %s' > release-notes.md
          if [ ! -s release-notes.md ]; then echo '- Maintenance release' > release-notes.md; fi
          gh release create '${{ github.ref_name }}' dist/* --title "OpenX11SE $version" --notes-file release-notes.md
